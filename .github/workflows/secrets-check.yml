# 시크릿 진단 — SECRETS_XCCONFIG 에 필요한 값이 제대로 들어있는지 배포 없이 확인한다.
#
# GitHub Secret 은 값을 다시 읽을 수 없어서, 잘못 넣었는지 알 방법이 배포해보는 것밖에 없었다.
# 이 워크플로가 그 확인을 대신한다. ubuntu 러너에서 몇 초, TestFlight 배포와 무관하다.
#
# ⚠️ 값은 절대 로그에 찍지 않는다(공개 저장소) — 존재 여부·형식 판정만 출력한다.
name: Secrets Check

on:
  # 검증 스크립트나 이 워크플로가 바뀌면 자동 확인.
  push:
    branches: [main]
    paths:
      - .github/workflows/secrets-check.yml
      - scripts/check-secrets.sh
  # 시크릿을 갱신한 뒤 눌러서 확인하는 용도(기본 브랜치에 올라간 뒤부터 UI에 노출된다).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Secrets.xcconfig
        # 값 안의 $()·백틱이 쉘에서 실행되지 않도록 환경변수로 넘겨 원문 그대로 기록(deploy.yml 과 동일).
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}
          ADMOB_APP_ID_OVERRIDE: ${{ secrets.ADMOB_APP_ID }}
        run: |
          printf '%s\n' "$SECRETS_XCCONFIG" > Secrets.xcconfig
          # deploy.yml 과 **같은 규칙**으로 만든다. 다르면 검사가 통과해도 배포가 깨진다.
          if [ -n "$ADMOB_APP_ID_OVERRIDE" ]; then
            printf 'ADMOB_APP_ID = %s\n' "$ADMOB_APP_ID_OVERRIDE" >> Secrets.xcconfig
            echo "ADMOB_APP_ID 를 별도 시크릿 값으로 덮어썼다."
          fi

      - name: Validate
        run: bash scripts/check-secrets.sh Secrets.xcconfig
