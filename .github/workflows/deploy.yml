# TestFlight 배포 — main 머지 시 자동 + 수동 실행(workflow_dispatch). 클라우드 맥 러너에서 빌드·서명·업로드.
# 로컬 맥 불필요. 필요한 GitHub Secrets는 docs/DEPLOY.md 참고.
# 빌드번호는 fastlane이 TestFlight 최신+1로 계산(git 커밋 안 함) → 배포가 자기 자신을 재트리거하지 않음.
name: Deploy TestFlight

on:
  push:
    branches:
      - main
    # 앱 바이너리에 닿지 않는 변경은 배포하지 않는다(불필요한 TestFlight 빌드 방지).
    #
    # `fastlane/Fastfile` 은 **일부러 빼지 않았다** — 배포 로직 자체라, 고쳤으면 다음
    # 배포에서 실제로 돌려 봐야 한다. 반면 스토어 목록 정보(`fastlane/metadata/`)는
    # `fastlane metadata` 레인이 따로 올리므로 빌드와 무관하다.
    paths-ignore:
      - "**/*.md"
      - "fastlane/metadata/**"
      - ".claude/**"
  workflow_dispatch:

# 배포를 직렬화 — 짧은 간격의 두 머지가 같은 빌드번호(TestFlight 최신+1)를 계산해
# 업로드가 거부되는 충돌을 막는다. 진행 중 업로드는 취소하지 않고 큐잉한다.
concurrency:
  group: deploy-testflight
  cancel-in-progress: false

# match가 서명 저장 브랜치(match-storage)에 push하므로 쓰기 권한 필요.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.xcconfig
        # 시크릿을 스크립트에 직접 박으면 bash가 값 안의 $()·백틱을 실행해 xcconfig의 //주석 회피
        # 트릭($())을 깨뜨림 → URL이 https:로 잘려 앱이 켜자마자 크래시. 환경변수로 넘겨 원문 그대로 기록.
        #
        # `ADMOB_APP_ID` 시크릿이 따로 있으면 그 값이 이긴다(xcconfig 는 뒤에 온 정의가 이긴다).
        #
        # **왜 갈라 뒀나** — SECRETS_XCCONFIG 는 6줄을 한 덩어리로 담는다. 그래서 한 줄만
        # 고치려 해도 6줄을 다 알아야 하고(되읽기가 안 된다), 손으로 복원하다 다른 줄을
        # 잃기 쉽다. 실제로 그렇게 앱 ID 한 줄이 광고 단위 ID 로 바뀐 채 배포됐다.
        # 자주 틀리는 값 하나만 떼어 두면 나머지를 건드리지 않고 고칠 수 있다.
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}
          ADMOB_APP_ID_OVERRIDE: ${{ secrets.ADMOB_APP_ID }}
        run: |
          printf '%s\n' "$SECRETS_XCCONFIG" > Secrets.xcconfig
          if [ -n "$ADMOB_APP_ID_OVERRIDE" ]; then
            printf 'ADMOB_APP_ID = %s\n' "$ADMOB_APP_ID_OVERRIDE" >> Secrets.xcconfig
            echo "ADMOB_APP_ID 를 별도 시크릿 값으로 덮어썼다."
          fi

      # 시크릿이 깨진 채로 빌드가 올라가는 것을 막는다. 오늘 그렇게 올라간 빌드가
      # 실행 즉시 죽었다 — 값 검증은 몇 초, 잘못된 배포는 심사 한 사이클이다.
      - name: Validate secrets
        run: bash scripts/check-secrets.sh Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Deploy to TestFlight
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://github.com/mjkang0987/clipnote-ios.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
