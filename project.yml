name: ClipNote
options:
  bundleIdPrefix: kr.co.clipnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.51.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 의 문자열 자동 추출을 끈다.
    #
    # SwiftUI `Text("리터럴")` 은 LocalizedStringKey 를 받기 때문에, 프로젝트에 문자열 카탈로그가
    # 있으면 Xcode 가 빌드할 때마다 그 리터럴들을 카탈로그에 밀어 넣는다. 우리는 카탈로그를
    # 손으로 관리하고(키는 `화면.이름` 꼴) 조회도 `LocalizationStore.t(_:)` 로 하므로 추출이
    # 필요 없다. 켜 두면 빌드할 때마다 한글 리터럴이 키로 섞여 들어와
    # `scripts/check-localizations.py` 가 "쓰는 곳이 없다"로 CI 를 떨어뜨린다.
    SWIFT_EMIT_LOC_STRINGS: NO
    # 표시 버전. **아래 두 타깃의 `CFBundleShortVersionString` 과 함께 올린다.**
    # 이 설정만 바꾸면 화면에 안 나온다 — XcodeGen 이 Info.plist 에 기본값 "1.0" 을
    # 리터럴로 써넣기 때문에 빌드 세팅이 덮이지 않는다(fastlane 이 CFBundleVersion 에서
    # 겪은 것과 같은 문제). 그래서 출시된 1.0.0 은 스토어에 1.0 으로 올라가 있다.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: "928S75PVRK"
targets:
  ClipNote:
    type: application
    platform: iOS
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - ClipNote
      - Shared
    dependencies:
      - target: ClipNoteShare
      - package: Supabase
        product: Supabase
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: ClipNote/Info.plist
      properties:
        # 위 MARKETING_VERSION 과 **같은 값**을 유지할 것(주석 참고).
        CFBundleShortVersionString: "1.1.0"
        CFBundleURLTypes:
          - CFBundleURLName: kr.co.clipnote.app
            CFBundleURLSchemes:
              - clipnote
        # 런치 스크린 — iOS 가 앱 코드 없이 그리는 정지 화면이다(애니메이션 불가).
        # 배경을 흰색 자산으로 못박는 이유: 생략하면 시스템 배경을 따라가 다크 모드 기기에서
        # 검게 떴다가 흰 앱으로 바뀐다. 앱 팔레트가 라이트 고정이라 흰색이 맞다.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 앱 내 언어 전환(LocalizationStore)이 언어별 .lproj 번들을 직접 열기 때문에,
        # 지원 언어가 번들에 실려 있어야 한다. 빠지면 조용히 전부 한국어로 폴백한다.
        # LocalizationStoreTests 가 이 목록과 문자열 카탈로그의 일치를 검증한다.
        CFBundleLocalizations: [ko, en, ja, zh-Hans]
        API_BASE: $(API_BASE)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NAVER_CLIENT_ID: $(NAVER_CLIENT_ID)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_BANNER_UNIT_ID: $(ADMOB_BANNER_UNIT_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: 5a6flpkh64.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: 9rd848q2bz.skadnetwork
          - SKAdNetworkIdentifier: n6fk4nfna4.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: ecpz2srf59.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: pwa73g5rt2.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: zq492l623r.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.clipnote.app
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ClipNote/ClipNote.entitlements
        DEVELOPMENT_TEAM: "928S75PVRK"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "kr.co.clipnote.app AppStore"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # 릴리스(TestFlight)는 fastlane match가 만든 프로파일 사용. Debug/로컬은 base 그대로.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore kr.co.clipnote.app"
  ClipNoteShare:
    type: app-extension
    platform: iOS
    sources:
      - ClipNoteShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.clipnote.app.Share
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ClipNoteShare/ClipNoteShare.entitlements
        DEVELOPMENT_TEAM: "928S75PVRK"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "kr.co.clipnote.app.Share AppStore"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ClipNote
      configs:
        # 릴리스(TestFlight)는 fastlane match가 만든 프로파일 사용. Debug/로컬은 base 그대로.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore kr.co.clipnote.app.Share"
    info:
      path: ClipNoteShare/Info.plist
      properties:
        CFBundleDisplayName: ClipNote
        # 앱과 표시 버전이 다르면 App Store Connect 가 업로드를 거부한다.
        CFBundleShortVersionString: "1.1.0"
        # 확장도 앱과 같은 4개 언어를 싣는다. Shared/Localization 이 두 타깃의 소스에 들어
        # 있어 문자열 카탈로그는 양쪽 번들에 각각 컴파일되고, LocalizationStore 는 확장의
        # Bundle.main 에서 .lproj 를 찾는다. 이 목록이 빠지면 확장만 조용히 한국어로 나온다.
        CFBundleLocalizations: [ko, en, ja, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  ClipNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipNoteTests
    dependencies:
      - target: ClipNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  ClipNote:
    build:
      targets:
        ClipNote: all
    test:
      targets:
        - ClipNoteTests
